# Netlify configuration for OTC-Website
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # build.mjs pre-renders every page to real HTML (so search engines can read
  # it) and writes the finished site to /dist, which Netlify publishes.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# -----------------------------------------------------------------------------
# Sensible defaults for a static marketing site.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache uploads aggressively (they rarely change)
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site script is versioned (?v=...) on every build, so it can be cached
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Note: the old catch-all redirect (/* → /index.html) was removed. It made every
# mistyped URL — and robots.txt / sitemap.xml — quietly return the homepage,
# which search engines treat as duplicate content. Unknown URLs now get the
# real 404 page (dist/404.html), which Netlify serves automatically.
