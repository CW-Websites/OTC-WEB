# Netlify configuration for OTC-Website
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Static site, no build step needed.
  publish = "."
  command = ""

# -----------------------------------------------------------------------------
# Sensible defaults for a static marketing site.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache uploads aggressively (they rarely change)
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source files cached briefly so updates show quickly
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
