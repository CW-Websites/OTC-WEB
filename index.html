<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!--
  This file is the TEMPLATE for every page. Don't add page text here —
  `npm run build` (build.mjs) fills in the markers below:
    HEAD → title, description, canonical, social preview, structured data
    APP  → the page content, rendered from /src
    PAGE → which page this is (home, cencon, sg, intergard, lms)
-->
<!--HEAD-->
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/uploads/favicon-16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/uploads/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/styles.css?v={{VERSION}}"/>
<link rel="stylesheet" href="/otc.css?v={{VERSION}}"/>
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
</head>
<body>
  <div id="root"><!--APP--></div>
  <!--PAGE-->
  <script src="/assets/site.js?v={{VERSION}}" defer></script>
</body>
</html>
